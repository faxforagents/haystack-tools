# Weekly grouped dependency updates. Minor and patch bumps arrive as one PR
# per ecosystem and directory. Majors come as their own PRs.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      pip-minor:
        update-types: [minor, patch]
    ignore:
      # haystack-ai 3 moves ToolInvoker out of haystack.components.tools and changes what haystack.tools
      # exports. The package needs a port for it, not a wider cap (PR 3, tested 2026-11-09).
      - dependency-name: "haystack-ai"
        update-types: ["version-update:semver-major"]
