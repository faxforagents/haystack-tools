[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "faxforagents-haystack"
version = "0.1.0"
description = "Fax for Agents tools for Haystack by deepset."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Fax for Agents (JSB Holdings LLC)", email = "hello@faxforagents.com"}]
keywords = ["haystack", "fax", "tools", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "haystack-ai>=2.31.1,<4",
  "faxforagents>=0.2.3,<0.3",
  "pydantic>=2.7.4,<3",
]

[project.urls]
Homepage = "https://faxforagents.com/"
Documentation = "https://faxforagents.com/docs/"
Repository = "https://github.com/faxforagents/haystack-tools"
Changelog = "https://github.com/faxforagents/haystack-tools/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "mypy>=1.18,<2", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/faxforagents_haystack"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "submissions", "pyproject.toml", "README.md", "LICENSE", "CHANGELOG.md", "uv.lock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src/faxforagents_haystack"]
